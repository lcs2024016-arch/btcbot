# Paper-trades one session per run. GitHub cron is UTC; IST = UTC + 5:30.
#   London   entries 13:30-17:30 IST (08:00-12:00 UTC) -> job starts ~12:47 IST
#   New York entries 18:30-22:30 IST (13:00-17:00 UTC) -> job starts ~18:07 IST
# Scheduled runs can start 5-30 min late, so jobs start early and the bot waits; missed bars are
# caught up from candles. The shared concurrency group makes the NY job wait for London to finish.
name: session

on:
  schedule:
    - cron: "17 7 * * 1-5"     # Mon-Fri 07:17 UTC = 12:47 IST  (London)
    - cron: "37 12 * * 1-5"    # Mon-Fri 12:37 UTC = 18:07 IST  (New York)
  workflow_dispatch:
    inputs:
      session:
        description: "london, newyork or auto (by current time)"
        default: auto

concurrency:
  group: forward-test
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Git identity
        run: |
          git config user.name "lcs2024016-arch"
          git config user.email "287223359+lcs2024016-arch@users.noreply.github.com"
      - name: Run session
        env:
          PYTHONUNBUFFERED: "1"
          LOKY_MAX_CPU_COUNT: "2"
        run: python bot.py --session "${{ github.event.inputs.session || 'auto' }}" --commit
